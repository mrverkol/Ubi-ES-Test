/* ---------- single source of truth: application state ---------- */
function fresh(){return {
  gameId:null,status:'NEW',screen:'home',mode:'single',netRole:null,gameCode:'',myPlayerId:null,
  players:[],active:0,round:1,colorMap:[],turnCat:null,turnJoker:false,level:1,qRole:'player',currentQ:null,
  turnNo:1,turn:{ownQP:0,contactQP:0,lp:0,contactReached:true},history:[],usedQ:{},finalRound:false,
  extraRound:false,extraPlayers:[],winnerId:null,winWhy:'',tieWhy:'',jokerBusy:false
}}
let S=fresh();
let timerId=null,seconds=30;
let MP={peer:null,hostConn:null,connections:[],suppress:false};

function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function clone(v){return JSON.parse(JSON.stringify(v))}
function gameScreen(){return ['turn','color','category','joker','difficulty','question','answer','result','location','lp','contactDifficulty','contactQuestion','contactAnswer','turnEnd','finalCheck','extra','winner'].includes(S.screen)}
function current(){return S.players[S.active]||null}
function playerById(id){return S.players.find(p=>String(p.id)===String(id))||null}
function isHost(){return S.mode==='single'||S.netRole==='host'}
function isActivePhone(){return S.mode==='single'||S.netRole==='host'||String(S.myPlayerId)===String(current()?.id)}
function threshold(p){return !!p&&(p.lp>=36||p.qp>=36)}
function saveLocal(){localStorage.setItem('ubi_es_clean_v11',JSON.stringify(S))}
function resetLocal(){localStorage.removeItem('ubi_es_clean_v11');S=fresh();saveLocal()}
function loadLocal(){try{const x=JSON.parse(localStorage.getItem('ubi_es_clean_v11')||'null');if(x&&typeof x==='object')S=x}catch(_ ){S=fresh()}}
function newGameId(){return 'G-'+Date.now()+'-'+Math.random().toString(36).slice(2,8)}

/* ---------- API: one gateway, one error shape ---------- */
async function ubiApi(path,options={}){
  const r=await fetch(API_BASE+path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});
  const raw=await r.text(); let data;
  try{data=raw?JSON.parse(raw):{}}catch(_ ){data={status:'ERROR',error:{code:'INVALID_JSON',message:'Serveren returnerede ikke JSON.'}}}
  if(!r.ok){const e=new Error(data?.error?.message||`API-fejl (${r.status})`);e.payload=data;e.status=r.status;throw e}
  return data;
}
function apiGameId(){if(!S.gameId)S.gameId=newGameId();return S.gameId}
function apiPlayerId(p){return String(p?.id||S.myPlayerId||'1')}

/* ---------- rendering shell ---------- */
function renderChrome(){
  const g=gameScreen();
  scorebar.classList.toggle('hidden',!g);
  bottom.classList.toggle('hidden',!g||S.netRole==='client');
  topLabel.textContent=g?`Runde ${S.round}`:'v1.1 · Clean Frontend';
  if(g) scorebar.innerHTML=S.players.map((p,i)=>`<div class="score-player ${i===S.active?'active':''}"><div class="score-name">${esc(p.name)}</div><div class="score-points">LP <b>${p.lp}</b> · QP <b>${p.qp}</b></div></div>`).join('');
}
function render(){stopTimer();renderChrome();let h='';if(S.finalRound&&gameScreen()&&!['winner','finalCheck'].includes(S.screen))h+=`<div class="banner">⚑ SLUTRUNDE – runden færdiggøres, så alle får lige mange ture</div>`;
  switch(S.screen){
    case 'home':h+=homeView();break;case 'create':h+=createView();break;case 'setup':h+=setupView();break;case 'lobby':h+=lobbyView();break;case 'turn':h+=turnView();break;case 'color':h+=colorView();break;case 'category':h+=categoryView();break;case 'joker':h+=jokerView();break;case 'difficulty':h+=difficultyView(false);break;case 'question':h+=questionView(false);break;case 'answer':h+=answerView(false);break;case 'result':h+=resultView();break;case 'location':h+=locationView();break;case 'lp':h+=lpView();break;case 'contactDifficulty':h+=difficultyView(true);break;case 'contactQuestion':h+=questionView(true);break;case 'contactAnswer':h+=answerView(true);break;case 'turnEnd':h+=turnEndView();break;case 'finalCheck':h+=finalCheckView();break;case 'extra':h+=extraView();break;case 'winner':h+=winnerView();break;default:h+=homeView();
  }
  main.innerHTML=h;startTimerIfNeeded();
}
function go(screen){S.screen=screen;saveLocal();broadcast();render()}

/* ---------- home / setup ---------- */
function homeView(){return `<div class="card center"><h1>UBI ES</h1><p>Det danske quizspil.</p><button class="btn primary" onclick="newSingleSetup()">NYT SPIL</button><button class="btn blue" onclick="newHost()">SPIL PÅ FLERE TELEFONER</button><div class="note" style="margin-top:10px"><b>Joker-systemet er serverstyret.</b><br>Emnet testes kun, når du trykker <b>TEST JOKER-EMNE</b>.</div><button class="btn ghost" onclick="runRegressionTests(true)">KØR SYSTEMTEST</button></div>`}
function newSingleSetup(){S=fresh();S.mode='single';S.gameId=newGameId();S.screen='create';render()}
function createView(){return `<div class="card"><h2>OPRET SPIL</h2><label>Antal spillere</label><select id="playerCount" class="select" onchange="bindCount()">${[2,3,4].map(n=>`<option value="${n}">${n} spillere</option>`).join('')}</select>${Array.from({length:4},(_,i)=>`<div id="nameWrap${i+1}" ${i>1?'style="display:none"':''}><label>Spiller ${i+1}</label><input id="name${i+1}" class="input" value="${['Jens','Spiller 2','Spiller 3','Spiller 4'][i]}"></div>`).join('')}<button class="btn primary" onclick="createSingleGame()">VIDERE</button><button class="btn ghost" onclick="go('home')">TILBAGE</button></div>`}
function bindCount(){const n=Number(document.getElementById('playerCount')?.value||2);for(let i=1;i<=4;i++){const e=document.getElementById('nameWrap'+i);if(e)e.style.display=i<=n?'block':'none'}}
function createSingleGame(){const n=Number(document.getElementById('playerCount')?.value||2);S.players=[];for(let i=1;i<=n;i++){const name=(document.getElementById('name'+i)?.value||`Spiller ${i}`).trim()||`Spiller ${i}`;S.players.push(playerTemplate(i,name))}S.gameId=newGameId();S.screen='setup';saveLocal();render()}
function playerTemplate(id,name){return {id,name,fixed:CATS[(id-1)%CATS.length],jokerCategory:CATS[(id-1)%CATS.length],jokerTopic:'',jokerValidationId:null,jokerStatus:'NOT_TESTED',ready:false,lp:0,qp:0,jokers:2,faret:false}}
function setupView(){return `<div class="card"><h2>SPILLEROPSÆTNING</h2><p class="tiny">Alle spillere skal vælge fast Joker-kategori og Joker-emne. Et emne er først klar, når serveren har godkendt det.</p>${S.players.map((p,i)=>playerSetupCard(p,i)).join('')}</div><button class="btn green" ${S.players.every(p=>p.ready)?'':'disabled'} onclick="startGame()">START SPILLET</button><button class="btn ghost" onclick="go('create')">TILBAGE</button>`}
function playerSetupCard(p,i){const f=p.jokerStatus==='APPROVED'?`<div class="status"><span class="ok">✓ Godkendt</span><br>${esc(p.jokerCategory)} · <b>${esc(p.jokerTopic)}</b></div>`:p.jokerStatus==='TESTING'?`<div class="status warn">Tester emnet…</div>`:p.jokerStatus==='ERROR'?`<div class="status danger">${esc(p.jokerError||'Emnet kunne ikke godkendes.')}</div>`:`<div class="tiny">Ikke testet endnu.</div>`;return `<div class="drag"><h3>${esc(p.name)}</h3><label>Joker-kategori</label><select id="jc${p.id}" class="select" onchange="changeJokerCategory(${p.id},this.value)">${CATS.map(c=>`<option ${c===p.jokerCategory?'selected':''}>${esc(c)}</option>`).join('')}</select><label>Joker-emne</label><input id="jt${p.id}" class="input" value="${esc(p.jokerTopic)}" placeholder="Fx Manchester United, Aarhus eller lystfiskeri" oninput="markJokerDirty(${p.id})"><button class="btn primary" onclick="validateJoker(${p.id})">TEST JOKER-EMNE</button>${f}</div>`}
function changeJokerCategory(id,v){const p=playerById(id);if(!p)return;p.jokerCategory=v;p.jokerStatus='NOT_TESTED';p.jokerValidationId=null;saveLocal();render()}
function markJokerDirty(id){const p=playerById(id);if(!p)return;if(p.jokerStatus==='APPROVED'){p.jokerStatus='NOT_TESTED';p.jokerValidationId=null;}}
async function validateJoker(id){const p=playerById(id);if(!p)return;const topic=(document.getElementById('jt'+id)?.value||'').trim();if(!topic){p.jokerStatus='ERROR';p.jokerError='Skriv et Joker-emne.';render();return}p.jokerTopic=topic;p.jokerStatus='TESTING';p.jokerError='';render();try{const data=await ubiApi(`/api/v1/games/${encodeURIComponent(apiGameId())}/players/${encodeURIComponent(apiPlayerId(p))}/joker/validate`,{method:'POST',body:JSON.stringify({categoryId:CAT_IDS[p.jokerCategory],topic})});if(data.status!=='APPROVED')throw new Error('Serveren godkendte ikke emnet.');p.jokerTopic=data.topic||topic;p.jokerValidationId=data.validationId||null;p.jokerStatus='APPROVED';p.jokerError='';saveLocal();render()}catch(e){p.jokerStatus='ERROR';p.jokerError=e?.payload?.error?.message||e.message||'Joker-emnet kunne ikke godkendes.';render()}}
function startGame(){if(!S.players.length||!S.players.every(p=>p.jokerStatus==='APPROVED'))return;S.status='ACTIVE';S.active=0;S.round=1;S.turnNo=1;S.screen='turn';S.colorMap=makeColorMap();saveLocal();broadcast();render()}

/* ---------- multiplayer ---------- */
function newHost(){if(typeof Peer==='undefined'){alert('Multiplayer-netværket kunne ikke indlæses.');return}S=fresh();S.mode='multi';S.netRole='host';S.gameCode=makeCode();S.gameId=S.gameCode;S.players=[playerTemplate(1,'Spiller 1')];S.players[0].ready=false;S.myPlayerId=1;S.screen='lobby';saveLocal();initHost();render()}
function makeCode(){return String(Math.floor(1000+Math.random()*9000))}
function initHost(){MP.peer=new Peer('ubi-es-'+S.gameCode);MP.peer.on('open',()=>render());MP.peer.on('connection',c=>{MP.connections.push(c);c.on('open',()=>c.send({type:'state',state:publicState()}));c.on('data',m=>hostMessage(c,m));c.on('close',()=>{MP.connections=MP.connections.filter(x=>x!==c);broadcast()})});MP.peer.on('error',e=>{if(e.type==='unavailable-id'){S.gameCode=makeCode();S.gameId=S.gameCode;try{MP.peer.destroy()}catch(_ ){}initHost();}else alert('Netværksfejl: '+e.type)})}
function connectClient(){const code=(document.getElementById('joinCode')?.value||'').replace(/\D/g,'').slice(0,4);const name=(document.getElementById('joinName')?.value||'').trim()||'Spiller';if(code.length!==4)return alert('Indtast den 4-cifrede spilkode.');if(typeof Peer==='undefined')return alert('Multiplayer-netværket kunne ikke indlæses.');S=fresh();S.mode='multi';S.netRole='client';S.gameCode=code;S.gameId=code;S.screen='lobby';S._joinName=name;MP.peer=new Peer();MP.peer.on('open',()=>{const c=MP.peer.connect('ubi-es-'+code,{reliable:true});MP.hostConn=c;c.on('open',()=>c.send({type:'join',name}));c.on('data',clientMessage);c.on('close',()=>{alert('Forbindelsen til spilstyreren er lukket.');leaveNetwork()})});MP.peer.on('error',e=>alert('Kunne ikke forbinde til spillet: '+e.type));render()}
function lobbyView(){if(S.netRole==='client')return `<div class="card"><h2>FORBUNDET TIL SPIL</h2><p>Spilkode: <b>${esc(S.gameCode)}</b></p>${clientSetup()}</div>${playerList()}`;return `<div class="card center"><h2>SPILSTYRER</h2><div class="pill">SPILKODE ${esc(S.gameCode)}</div><p class="tiny">Åbn spillet på de andre telefoner og indtast koden.</p><div class="drag"><b>Din spiller</b><br>${esc(current()?.name||'Spiller 1')}</div></div>${hostSetup()}${playerList()}<button class="btn green" ${S.players.length>=2&&S.players.every(p=>p.ready)?'':'disabled'} onclick="startGame()">START SPILLET</button><button class="btn ghost" onclick="leaveNetwork()">AFSLUT</button>`}
function clientSetup(){const p=playerById(S.myPlayerId);if(!p)return `<p>Venter…</p>`;return `<label>Fast kategori</label><select id="mpFixed" class="select" onchange="clientProfileDirty()">${CATS.map(c=>`<option ${c===p.fixed?'selected':''}>${esc(c)}</option>`).join('')}</select><label>Joker-kategori</label><select id="mpJCat" class="select" onchange="clientProfileDirty()">${CATS.map(c=>`<option ${c===p.jokerCategory?'selected':''}>${esc(c)}</option>`).join('')}</select><label>Joker-emne</label><input id="mpJTopic" class="input" value="${esc(p.jokerTopic)}" placeholder="Fx Manchester United eller Aarhus" oninput="clientProfileDirty()"><button class="btn primary" onclick="clientValidateJoker()">TEST JOKER-EMNE</button><div>${p.jokerStatus==='APPROVED'?'<div class="status"><span class="ok">✓ Joker-emnet er godkendt</span></div>':p.jokerStatus==='TESTING'?'<div class="status warn">Tester emnet…</div>':p.jokerStatus==='ERROR'?`<div class="status danger">${esc(p.jokerError)}</div>`:'<p class="tiny">Emnet skal godkendes før du kan melde dig klar.</p>'}</div><button class="btn ${p.ready?'ghost':'green'}" ${p.jokerStatus==='APPROVED'?'':'disabled'} onclick="clientReady()">${p.ready?'FORTRYD KLAR':'JEG ER KLAR'}</button>`}
function hostSetup(){const p=playerById(1);return `<div class="card"><h3>SPILLER 1 · ${esc(p.name)}</h3>${playerSetupCard(p,0)}</div>`}
function playerList(){return `<div class="card"><h3>SPILLERE</h3>${S.players.map(p=>`<div class="playerline"><span><b>${esc(p.name)}</b><br><span class="tiny">${esc(p.jokerCategory)}${p.jokerTopic?' · '+esc(p.jokerTopic):''}</span></span><span class="${p.ready?'ok':'muted'}">${p.ready?'✓ Klar':'Ikke klar'}</span></div>`).join('')}</div>`}
function hostMessage(c,m){if(!m||!m.type)return;if(m.type==='join'){if(S.players.length>=4)return;const id=Math.max(...S.players.map(p=>Number(p.id)))+1;const p=playerTemplate(id,m.name||`Spiller ${id}`);S.players.push(p);S.order=S.players.map(x=>x.id);c.playerId=id;c.send({type:'assigned',playerId:id,state:publicState()});saveLocal();broadcast();render();return}if(!c.playerId)return;const p=playerById(c.playerId);if(!p)return;if(m.type==='profile'){p.name=String(m.name||p.name).slice(0,24);if(CATS.includes(m.fixed))p.fixed=m.fixed;if(CATS.includes(m.jokerCategory))p.jokerCategory=m.jokerCategory;p.jokerTopic=String(m.jokerTopic||'').slice(0,120);p.jokerValidationId=m.jokerValidationId||null;p.jokerStatus=m.jokerStatus==='APPROVED'?'APPROVED':'NOT_TESTED';p.ready=false;saveLocal();broadcast();render()}if(m.type==='ready'){p.ready=!!m.ready&&p.jokerStatus==='APPROVED';saveLocal();broadcast();render()}if(m.type==='action'){if(c.playerId===current()?.id)applyAction(m.action,m.data||{})}}
function clientMessage(m){if(!m)return;if(m.type==='assigned'){S.myPlayerId=m.playerId;applyPublicState(m.state);render()}else if(m.type==='state'){applyPublicState(m.state);render()}else if(m.type==='gameEnded')leaveNetwork(false)}
function clientProfileDirty(){const p=playerById(S.myPlayerId);if(!p)return;p.fixed=document.getElementById('mpFixed')?.value||p.fixed;p.jokerCategory=document.getElementById('mpJCat')?.value||p.jokerCategory;p.jokerTopic=document.getElementById('mpJTopic')?.value||p.jokerTopic;p.jokerStatus='NOT_TESTED';p.jokerValidationId=null;sendHost({type:'profile',name:p.name,fixed:p.fixed,jokerCategory:p.jokerCategory,jokerTopic:p.jokerTopic,jokerValidationId:null,jokerStatus:'NOT_TESTED'})}
async function clientValidateJoker(){const p=playerById(S.myPlayerId);if(!p)return;p.fixed=document.getElementById('mpFixed')?.value||p.fixed;p.jokerCategory=document.getElementById('mpJCat')?.value||p.jokerCategory;p.jokerTopic=(document.getElementById('mpJTopic')?.value||'').trim();if(!p.jokerTopic)return alert('Skriv et Joker-emne.');p.jokerStatus='TESTING';render();try{const data=await ubiApi(`/api/v1/games/${encodeURIComponent(apiGameId())}/players/${encodeURIComponent(apiPlayerId(p))}/joker/validate`,{method:'POST',body:JSON.stringify({categoryId:CAT_IDS[p.jokerCategory],topic:p.jokerTopic})});p.jokerTopic=data.topic||p.jokerTopic;p.jokerValidationId=data.validationId;p.jokerStatus='APPROVED';p.jokerError='';sendHost({type:'profile',name:p.name,fixed:p.fixed,jokerCategory:p.jokerCategory,jokerTopic:p.jokerTopic,jokerValidationId:p.jokerValidationId,jokerStatus:'APPROVED'});render()}catch(e){p.jokerStatus='ERROR';p.jokerError=e?.payload?.error?.message||e.message;sendHost({type:'profile',name:p.name,fixed:p.fixed,jokerCategory:p.jokerCategory,jokerTopic:p.jokerTopic,jokerValidationId:null,jokerStatus:'NOT_TESTED'});render()}}
function clientReady(){const p=playerById(S.myPlayerId);if(!p)return;p.ready=!p.ready;sendHost({type:'ready',ready:p.ready})}
function sendHost(m){if(MP.hostConn?.open)MP.hostConn.send(m)}
function publicState(){const x=clone(S);delete x._joinName;return x}
function applyPublicState(x){const my=S.myPlayerId,role=S.netRole,mode=S.mode;S=clone(x);S.myPlayerId=my;S.netRole=role;S.mode=mode}
function broadcast(){if(S.netRole!=='host'||MP.suppress)return;const st=publicState();MP.connections.filter(c=>c?.open).forEach(c=>{try{c.send({type:'state',state:st})}catch(_ ){}})}
function leaveNetwork(show=true){try{MP.hostConn?.close();MP.peer?.destroy();MP.connections.forEach(c=>c.close())}catch(_ ){}MP={peer:null,hostConn:null,connections:[],suppress:false};S=fresh();if(show)S.screen='home';render()}

/* ---------- turn engine ---------- */
function makeColorMap(){const cats=[...new Set(S.players.map(p=>p.fixed))];const rest=CATS.filter(c=>!cats.includes(c));const chosen=[...cats,...rest].slice(0,6);return chosen.map((cat,i)=>({cat,emoji:COLORS[i][0],name:COLORS[i][1]}))}
function diceFace(n){return ['⚀','⚁','⚂','⚃','⚄','⚅'][Math.max(1,Math.min(6,n))-1]}
function turnView(){const p=current();if(!p)return homeView();if(!isActivePhone())return waitCard(`${esc(p.name)} er i gang.`);return `<div class="card center"><div class="pill">RUNDE ${S.round} · TUR ${S.turnNo}</div><h2>${esc(p.name)}s tur</h2><div class="dice">🎲</div><p>Slå den 6-farvede terning.</p><button class="btn primary" onclick="playerAction('colorDone')">FARVE SLÅET</button><div class="status">LP ${p.lp} · QP ${p.qp}<br>Joker ${p.jokers} tilbage · Faret vild: ${p.faret?'brugt':'klar'}</div></div>`}
function colorView(){if(!isActivePhone())return waitCard();return `<div class="card center"><h2>VÆLG FARVEN</h2><div class="grid3">${S.colorMap.map(x=>`<button class="level" style="background:${COLOR_HEX[x.name]}" onclick="playerAction('chooseCat',{cat:'${esc(x.cat)}'})">${x.emoji}<small>${esc(x.cat)}</small></button>`).join('')}</div><p class="tiny">Tryk på den farve, terningen viser.</p></div>`}
function categoryColor(cat){if(S.turnJoker)return '#7024a5';const x=S.colorMap.find(v=>v.cat===cat);return x?COLOR_HEX[x.name]:'#ff6b18'}
function categoryView(){const p=current();if(!isActivePhone())return waitCard();return `<div class="card center"><div class="turn-category" style="background:${categoryColor(S.turnCat)}">${esc(S.turnCat).toUpperCase()}</div><button class="btn primary" onclick="playerAction('continueCategory')">FORTSÆT MED ${esc(S.turnCat).toUpperCase()}</button><button class="btn joker" ${p.jokers<1||p.jokerStatus!=='APPROVED'?'disabled':''} onclick="playerAction('openJoker')">★ BRUG MIN JOKER · ${p.jokers}</button><p class="tiny">Joker erstatter kategoriens spørgsmål for denne tur.</p></div>`}
function jokerView(){const p=current();if(!p)return homeView();return `<div class="card center"><h2>★ MIN JOKER</h2><div class="status"><b>Kategori:</b> ${esc(p.jokerCategory)}<br><b>Godkendt emne:</b> ${esc(p.jokerTopic)}</div><p>Tryk kun én gang. Serveren bruger den allerede godkendte kategori og emne.</p><button class="btn joker" ${S.jokerBusy?'disabled':''} onclick="playerAction('useJoker')">BRUG MIN JOKER</button><button class="btn ghost" onclick="go('category')">TILBAGE</button><div id="jokerUseError"></div></div>`}
async function useJoker(){if(S.netRole==='client'){sendHost({type:'action',action:'useJoker',data:{}});return}const p=current();if(!p||p.jokers<1||p.jokerStatus!=='APPROVED'||S.jokerBusy)return;S.jokerBusy=true;render();try{const data=await ubiApi(`/api/v1/games/${encodeURIComponent(apiGameId())}/players/${encodeURIComponent(apiPlayerId(p))}/joker/use`,{method:'POST',body:JSON.stringify({turnId:'T-'+S.turnNo})});if(data.status!=='READY')throw new Error('Joker-spørgsmålet blev ikke godkendt.');p.jokers--;S.turnCat=p.jokerCategory;S.turnJoker=true;S.currentQ={q:data.question,a:data.answer,id:data.questionId,source:(data.sources||[]).map(s=>`${s.title} – ${s.url}`).join(' | '),key:data.questionId};S.level=Number(String(data.level||'N3').replace('N',''))||3;S.qRole='player';S.history.push(`${p.name} brugte Joker: ${p.jokerCategory} – ${p.jokerTopic}`);S.jokerBusy=false;go('question')}catch(e){S.jokerBusy=false;S.screen='joker';saveLocal();render();const el=document.getElementById('jokerUseError');if(el)el.innerHTML=`<div class="status danger">${esc(e?.payload?.error?.message||e.message||'Joker-generatoren er midlertidigt utilgængelig.')}</div>`}}
function difficultyView(contact){if(!isActivePhone())return waitCard();return `<div class="card center"><h2>${contact?'KONTAKTENS SPØRGSMÅL':esc(S.turnCat).toUpperCase()}</h2><p>Vælg sværhedsgrad.</p><div class="grid3">${[1,2,3,4,5,6].map(n=>`<button class="level" onclick="playerAction('pickLevel',{level:${n},contact:${contact}})">${n}<small>${['Meget let','Let','Middel','Svær','Meget svær','Ekspert'][n-1]}</small></button>`).join('')}</div></div>`}
function pickQuestion(cat,lvl,contact){const pool=(BASE[cat]||[]).filter(x=>x.level==='N'+lvl&&x.status==='GODKENDT');const used=Object.keys(S.usedQ||{});const avail=pool.filter(x=>!used.includes(x.id));const arr=avail.length?avail:pool;if(!arr.length)return {id:'NONE',q:'Ingen spørgsmål tilgængelige.',a:''};const x=arr[(S.turnNo+(contact?1:0))%arr.length];return {id:x.id,q:x.q,a:x.a,source:x.source||''}}
function questionView(contact){if(!S.currentQ)return waitCard();return `<div class="card"><span class="pill">${esc(S.turnCat).toUpperCase()} · NIVEAU ${S.level}</span><h2 style="margin-top:24px">${esc(S.currentQ.q)}</h2><div class="timer"><div><b id="secs">30</b><br><span class="tiny">sekunder</span></div></div><p class="tiny center">Facit vises først efter svaret er afgivet.</p>${isActivePhone()?`<button class="btn primary" onclick="playerAction('answerGiven',{contact:${contact}})">SVAR AFGIVET</button>`:`<p class="note">Kun den aktive spiller fortsætter.</p>`}</div>`}
function answerView(contact){return `<div class="card center"><span class="pill">${esc(S.turnCat).toUpperCase()} · NIVEAU ${S.level}</span><h2>SVAR AFGIVET</h2><div class="answer">KORREKT SVAR<br><br>${esc(S.currentQ?.a||'')}</div>${S.turnJoker&&S.currentQ?.source?`<div class="note">Kilder: ${esc(S.currentQ.source)}</div>`:''}${isHost()?`<p>${contact?'Var kontaktens svar korrekt?':'Var svaret korrekt?'}</p><div class="row"><button class="btn green" onclick="hostAction('judge',{ok:true,contact:${contact}})">✓ KORREKT</button><button class="btn red" onclick="hostAction('judge',{ok:false,contact:${contact}})">✕ FORKERT</button></div>`:'<p class="note">Venter på Spilstyrer.</p>'}</div>`}
function resultView(){return `<div class="card center"><h2>${S.turn.ownQP?'✓ KORREKT':'✕ FORKERT'}</h2><div class="big">+${S.turn.ownQP} QP</div><p>QP i alt: <b>${current().qp}</b></p>${isActivePhone()?`<button class="btn primary" onclick="playerAction('toLocation')">VIDERE TIL KONTAKT</button>`:'<p class="note">Venter på den aktive spiller.</p>'}</div>`}
function locationView(){const p=current();if(!isActivePhone())return waitCard();return `<div class="card center"><div class="big">☎</div><h2>FIND KONTAKTEN</h2><p>Placér brikken og ring til kontakten.</p><button class="btn blue" ${p.faret?'disabled':''} onclick="playerAction('faret')">★ FARET VILD ${p.faret?'· BRUGT':''}</button><button class="btn green" onclick="playerAction('located')">📍 KONTAKT LOKALISERET</button><button class="btn ghost" onclick="playerAction('noContact')">INGEN KONTAKT OPNÅET</button></div>`}
function lpView(){const p=current();if(!isHost())return waitCard('Venter på Spilstyrer…');const max=p.faret?8:12;return `<div class="card center"><h2>LOCATION POINT</h2><p>Hvor mange LP fik ${esc(p.name)}?</p>${p.faret?'<div class="banner">FARET VILD BRUGT – MAKS. 8 LP</div>':''}<input id="lpInput" type="number" min="0" max="${max}" value="${Math.min(max,7)}" class="input" style="font-size:28px;text-align:center"><button class="btn green" onclick="hostAction('approveLP',{value:Number(document.getElementById('lpInput').value)||0})">GODKEND LP</button></div>`}
function contactAnswerView(){return answerView(true)}
function turnEndView(){const p=current();return `<div class="card center"><h2>TUR AFSLUTTET</h2><div class="turnsum"><span>Eget spørgsmål</span><b>+${S.turn.ownQP} QP</b><span>Kontaktspørgsmål</span><b>+${S.turn.contactQP} QP</b><span>Location</span><b>+${S.turn.lp} LP</b></div><h2>LP ${p.lp} · QP ${p.qp}</h2>${threshold(p)?`<div class="banner">${esc(p.name)} har nået 36.</div>`:''}${isHost()?`<button class="btn primary" onclick="hostAction('finishTurn')">${isRoundEnd()?'AFSLUT RUNDE':'START NÆSTE TUR'}</button>`:'<p class="note">Venter på Spilstyrer.</p>'}</div>`}
function waitCard(t='Venter på Spilstyrer…'){return `<div class="card center"><h2>VENTER</h2><p>${t}</p></div>`}
function isRoundEnd(){return S.active===S.players.length-1}
function startTimerIfNeeded(){if(['question','contactQuestion'].includes(S.screen)){seconds=30;timerId=setInterval(()=>{seconds--;const e=document.getElementById('secs');if(e)e.textContent=seconds;if(seconds<=0){stopTimer();if(isActivePhone())playerAction('answerGiven',{contact:S.screen==='contactQuestion'})}},1000)}}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}

/* ---------- actions ---------- */
function playerAction(action,data={}){if(S.netRole==='client'){sendHost({type:'action',action,data});return}applyAction(action,data)}
function applyAction(action,data){
  const p=current();if(!p)return;
  if(action==='colorDone'){S.colorMap=S.colorMap.length?S.colorMap:makeColorMap();go('color');return}
  if(action==='chooseCat'){S.turnCat=data.cat;S.turnJoker=false;go('category');return}
  if(action==='continueCategory'){go('difficulty');return}
  if(action==='openJoker'){if(p.jokers>0&&p.jokerStatus==='APPROVED')go('joker');return}
  if(action==='pickLevel'){S.level=Number(data.level);S.qRole=data.contact?'contact':'player';S.currentQ=pickQuestion(S.turnCat,S.level,!!data.contact);go(data.contact?'contactQuestion':'question');return}
  if(action==='answerGiven'){go(data.contact?'contactAnswer':'answer');return}
  if(action==='toLocation'){go('location');return}
  if(action==='faret'){p.faret=true;S.history.push(`${p.name} brugte Faret vild`);saveLocal();broadcast();render();return}
  if(action==='located'){go('lp');return}
  if(action==='noContact'){S.turn.contactReached=false;S.turn.lp=0;S.history.push(`${p.name}: ingen kontakt, 0 LP`);go('contactDifficulty');return}
}
function hostAction(action,data={}){if(!isHost())return;if(action==='judge'){markUsed(S.currentQ?.id);const pts=data.ok?S.level:0;if(data.contact){pAdd('qp',pts);S.turn.contactQP=pts;S.history.push(`${current().name}: kontakt ${data.ok?'+ '+pts+' QP':'forkert'}`);go('turnEnd')}else{pAdd('qp',pts);S.turn.ownQP=pts;S.history.push(`${current().name}: eget ${data.ok?'+ '+pts+' QP':'forkert'}`);go('result')}return}if(action==='approveLP'){const p=current(),n=Math.max(0,Math.min(p.faret?8:12,Number(data.value)||0));p.lp+=n;S.turn.lp=n;S.history.push(`${p.name}: +${n} LP${p.faret?' (Faret vild)':''}`);go('contactDifficulty');return}if(action==='finishTurn'){finishTurn();return}if(action==='calculateWinner'){calculateWinner();return}}
function pAdd(k,n){current()[k]+=n}
function markUsed(id){if(!id||id==='NONE'||String(id).startsWith('JOKER-'))return;S.usedQ=S.usedQ||{};S.usedQ[id]=true}
function finishTurn(){const p=current();if(threshold(p)&&!S.finalRound){S.finalRound=true;S.history.push(`Slutrunde aktiveret af ${p.name}`)}S.turn={ownQP:0,contactQP:0,lp:0,contactReached:true};S.turnJoker=false;S.currentQ=null;if(S.extraRound){const pos=S.extraPlayers.indexOf(p.id);if(pos===S.extraPlayers.length-1){go('finalCheck');return}S.active=S.players.findIndex(x=>x.id===S.extraPlayers[pos+1]);S.turnNo++;go('turn');return}if(isRoundEnd()){if(S.finalRound){go('finalCheck');return}S.active=0;S.round++;S.turnNo++;S.colorMap=makeColorMap();go('turn')}else{S.active++;S.turnNo++;S.colorMap=makeColorMap();go('turn')}}

/* ---------- winner logic ---------- */
function namesText(ps){const a=ps.map(p=>p.name);return a.length<2?(a[0]||''):a.length===2?`${a[0]} og ${a[1]}`:`${a.slice(0,-1).join(', ')} og ${a[a.length-1]}`}
function poss(n){return /[sxz]$/i.test(n)?n+"'":n+'s'}
function evaluateWinner(players,eligibleIds=null){const scope=eligibleIds?players.filter(p=>eligibleIds.includes(p.id)):players.slice(),c=scope.filter(threshold);if(!c.length)return {type:'continue',ids:[],text:''};if(c.length===1){const w=c[0];const r=w.lp>=36&&w.qp>=36?'36 i både LP og QP':w.lp>=36?'36 LP':'36 QP';return {type:'winner',winner:w,ids:[w.id],text:`${w.name} var den eneste spiller, der nåede ${r}, og vinder spillet.`}}const both=c.filter(p=>p.lp>=36&&p.qp>=36);if(both.length===1)return {type:'winner',winner:both[0],ids:[both[0].id],text:`${both[0].name} var den eneste spiller, der nåede 36 i både LP og QP, og vinder derfor spillet.`};const pool=both.length?both:c;const mode=both.length?'both':pool.every(p=>p.qp>=36&&p.lp<36)?'qp':pool.every(p=>p.lp>=36&&p.qp<36)?'lp':'mixed';const vals=pool.map(p=>({p,v:mode==='both'?Math.min(p.lp,p.qp):mode==='qp'?p.lp:mode==='lp'?p.qp:(p.lp>=36?p.qp:p.lp)}));const max=Math.max(...vals.map(x=>x.v));const tied=vals.filter(x=>x.v===max).map(x=>x.p);if(tied.length>1)return {type:'tie',ids:tied.map(p=>p.id),text:`${namesText(tied)} står lige efter slutrunden. Derfor skal de spille en ekstra runde. Alle point beholdes.`};const w=tied[0];return {type:'winner',winner:w,ids:[w.id],text:`${w.name} vinder efter sammenligning af ${mode==='both'?'det laveste pointtal':mode==='qp'?'LP':mode==='lp'?'QP':'den anden pointtype'}.`}}
function calculateWinner(){const r=evaluateWinner(S.players,S.extraRound&&S.extraPlayers.length?S.extraPlayers:null);if(r.type==='continue'){S.finalRound=false;S.extraRound=false;S.extraPlayers=[];S.active=0;S.round++;S.turnNo++;go('turn');return}if(r.type==='winner'){S.winnerId=r.winner.id;S.winWhy=r.text;S.history.push(`${r.winner.name} vinder`);go('winner');return}S.extraRound=true;S.extraPlayers=r.ids;S.tieWhy=r.text;S.history.push(`Ekstra runde: ${r.ids.map(id=>playerById(id).name).join(', ')}`);go('extra')}
function extraView(){return `<div class="card center"><h2>EKSTRA RUNDE</h2><p>${esc(S.tieWhy)}</p>${S.extraPlayers.map(id=>{const p=playerById(id);return `<div class="drag"><b>${esc(p.name)}</b> · LP ${p.lp} · QP ${p.qp}</div>`}).join('')}<button class="btn primary" onclick="startExtra()">START EKSTRA RUNDE</button></div>`}
function startExtra(){S.round++;S.active=S.players.findIndex(p=>p.id===S.extraPlayers[0]);S.turnNo++;S.finalRound=false;go('turn')}
function winnerView(){const w=playerById(S.winnerId);return `<div class="card center"><div class="winner">🏆 VINDER</div><h1>${esc(w?.name||'')}</h1><div class="big">LP ${w?.lp||0} · QP ${w?.qp||0}</div><div class="status">${esc(S.winWhy)}</div><button class="btn primary" onclick="openPanel('score')">SE STILLINGEN</button><button class="btn ghost" onclick="newSingleSetup()">NYT SPIL</button></div>`}

/* ---------- panels / rules / regression ---------- */
function scoreTable(){return `<table class="scoreTable"><tr><th>Spiller</th><th>LP</th><th>QP</th><th>J</th><th>FV</th></tr>${S.players.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.lp}</td><td>${p.qp}</td><td>${p.jokers}</td><td>${p.faret?'✓':'–'}</td></tr>`).join('')}</table>`}
function openPanel(type){stopTimer();if(type==='score')main.innerHTML=`<div class="card"><h2>SCORE</h2>${scoreTable()}<button class="btn primary" onclick="render()">LUK</button></div>`;if(type==='history')main.innerHTML=`<div class="card"><h2>HISTORIK</h2>${S.history.length?S.history.slice().reverse().map(x=>`<div class="drag">${esc(x)}</div>`).join(''):'<p>Ingen hændelser.</p>'}<button class="btn primary" onclick="render()">LUK</button></div>`;if(type==='rules')main.innerHTML=`<div class="card"><h2>KORTE REGLER</h2><p><b>36 LP eller 36 QP</b> aktiverer slutrunden. LP og QP holdes adskilt.</p><p>Spiller og kontakt får hvert sit spørgsmål og vælger niveau separat.</p><p>Spilstyrer bedømmer svar og tildeler LP. Faret vild kan bruges højst én gang pr. spiller og begrænser LP til 8.</p><p>En Joker har fast kategori og et servergodkendt emne. Emnet testes kun ved tryk på TEST JOKER-EMNE. Ved brug sendes kun turnId til generatoren.</p><button class="btn primary" onclick="render()">LUK</button></div>`;if(type==='game')main.innerHTML=`<div class="card"><h2>SPIL</h2><p>Frontend er bygget med én central spiltilstand. Spilstyrer er autoritativ i multiplayer.</p><button class="btn red" onclick="confirmAbandon()">AFSLUT SPIL UDEN VINDER</button><button class="btn ghost" onclick="render()">FORTSÆT</button></div>`}
function confirmAbandon(){if(confirm('Afslut spillet uden vinder?')){if(S.netRole==='host')broadcastGameEnded();leaveNetwork(false);S=fresh();render()}}
function broadcastGameEnded(){MP.connections.forEach(c=>{try{c.send({type:'gameEnded'});c.close()}catch(_ ){}})}
function runRegressionTests(show=true){const tests=[];const add=(id,fn,exp)=>tests.push({id,fn,exp});const ps=a=>a.map((r,i)=>({id:i+1,name:r[0],lp:r[1],qp:r[2]}));add('T01',()=>evaluateWinner(ps([['Jens',36,20],['Peter',20,20]])).type,'winner');add('T02',()=>evaluateWinner(ps([['Jens',20,36],['Peter',20,20]])).type,'winner');add('T03',()=>evaluateWinner(ps([['Jens',36,36],['Peter',20,20]])).type,'winner');add('T04',()=>evaluateWinner(ps([['Jens',35,35],['Peter',20,20]])).type,'continue');add('T05',()=>evaluateWinner(ps([['Jens',36,36],['Peter',36,36]])).type,'tie');add('T06',()=>{const x=fresh();return [x.round,x.players.length,x.finalRound,x.extraRound].join('|')},'1|0|false|false');add('T07',()=>{const x=playerTemplate(1,'A');return [x.jokerStatus,x.jokerValidationId,x.jokers,x.faret].join('|')},'NOT_TESTED||2|false');add('T08',()=>{const s=JSON.stringify({categoryId:CAT_IDS['Videnskab & Teknologi'],topic:'A'});return s.includes('VIDENSKAB_TEKNologi')?'OK':'BAD'},'OK');add('T09',()=>{const x={status:'ERROR',error:{message:'x'}};return x.error.message},'x');add('T10',()=>{const x=clone(fresh());x.status='ABANDONED';return [x.status,x.players.length].join('|')},'ABANDONED|0');const out=tests.map(t=>{let a;try{a=t.fn()}catch(e){a='ERROR: '+e.message}return {id:t.id,pass:a===t.exp,actual:a,expected:t.exp}});const n=out.filter(x=>x.pass).length;window.__UBI_CLEAN_TESTS__=out;if(show)main.innerHTML=`<div class="card"><h2>SYSTEMTEST T01–T10</h2><div class="status ${n===out.length?'':'danger'}"><b>${n}/${out.length} bestået</b></div>${out.map(x=>`<div class="drag"><b>${x.pass?'✓':'✕'} ${x.id}</b>${x.pass?'':`<div class="tiny">Forventet: ${esc(x.expected)}<br>Faktisk: ${esc(x.actual)}</div>`}</div>`).join('')}<button class="btn primary" onclick="render()">LUK</button></div>`;return out}

/* ---------- public state excludes secrets only where possible ---------- */
function setupJoinView(){return `<div class="card"><h2>FORBIND TIL SPIL</h2><label>Navn</label><input id="joinName" class="input" placeholder="Dit navn"><label>4-cifret spilkode</label><input id="joinCode" class="input" inputmode="numeric" maxlength="4" placeholder="1234"><button class="btn primary" onclick="connectClient()">FORBIND</button><button class="btn ghost" onclick="go('home')">TILBAGE</button></div>`}

/* ---------- boot ---------- */
loadLocal();
if(S.mode==='multi'&&S.netRole==='client'){S=fresh()}
render();
/* Expose a tiny join helper from the home screen without adding another state branch. */
const originalHome=homeView;
window.homeView=function(){return originalHome()+`<div class="card"><h3>DELTAG I EKSISTERENDE SPIL</h3>${setupJoinView().replace('<div class="card">','').replace('</div>','')}</div>`};
</script>
</body></html>
