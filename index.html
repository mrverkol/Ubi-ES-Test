const UBI_ES_API = window.UBI_ES_API || "";
async function ubiApi(path, options={}) {
  const r = await fetch(UBI_ES_API + path, {
    headers: {"Content-Type":"application/json", ...(options.headers||{})},
    ...options
  });
  const data = await r.json().catch(()=>({status:"ERROR",error:{message:"Ugyldigt serversvar"}}));
  if(!r.ok) throw Object.assign(new Error(data?.error?.message||"API-fejl"), {payload:data,status:r.status});
  return data;
}

function migrateQPGame(g){
  if(!g||typeof g!=='object')return g;
  (g.players||[]).forEach(p=>{if(p.qp==null&&p.sp!=null)p.qp=p.sp;delete p.sp});
  if(g.mode==='sp')g.mode='qp';
  return g;
}

}

let MP={peer:null,connections:[],hostConn:null,suppress:false};
function makeCode(){return String(Math.floor(1000+Math.random()*9000))}
function netState(){let x=JSON.parse(JSON.stringify(S));x.netRole=undefined;x.peerId=undefined;return x}
function broadcastState(){if(S.netRole!=='host')return;let msg={type:'state',state:netState()};MP.connections=MP.connections.filter(c=>c&&c.open);MP.connections.forEach(c=>{try{c.send(msg)}catch(e){}})}

function playerAction(action,data={}){
  if(!isActivePhone())return;
  if(isHost()){applyPlayerAction(action,data);broadcastState()} else sendHost({type:'playerAction',action,data});
}

  if(!isHost())return;
  applyHostAction(action,data);broadcastState();
}
function applyPlayerAction(a,d){
  if(a==='colorDone'&&S.screen==='turn')go('color');
  else if(a==='chooseCat'&&S.screen==='color'){S.turnCat=d.cat;S.turnJoker=false;go('category')}
  else if(a==='continueCategory'&&S.screen==='category')go('difficulty');
  else if(a==='joker'&&S.screen==='category')openJokerInput();
  else if(a==='pickLevel'&&['difficulty','contactDifficulty'].includes(S.screen))pickLevelCore(Number(d.level),!!d.contact);
  else if(a==='answerGiven'&&['question','contactQuestion'].includes(S.screen)){stopTimer();go(d.contact?'contactAnswer':'answer')}
  else if(a==='toLocation'&&S.screen==='result')go('location');
  else if(a==='faret'&&S.screen==='location')useFaretCore();
  else if(a==='located'&&S.screen==='location')go('lp');
  else if(a==='noContact'&&S.screen==='location')noContactCore();
}
function applyHostAction(a,d){
  if(a==='judge'&&['answer','contactAnswer'].includes(S.screen))judgeCore(!!d.ok,!!d.contact);
  else if(a==='approveLP'&&S.screen==='lp')approveLPCore(Number(d.value));
  else if(a==='finishTurn'&&S.screen==='turnEnd')finishTurnCore();
  else if(a==='calculateWinner'&&S.screen==='finalCheck')calculateWinner();
}

function initHostNetwork(){
  if(typeof Peer==='undefined'){alert('Multiplayer-netværket kunne ikke indlæses. Kontrollér internetforbindelsen.');return}
  S.gameCode=makeCode(); S.netRole='host'; S.peerId='ubi-es-'+S.gameCode;
  MP.peer=new Peer(S.peerId);
  MP.peer.on('open',()=>{save();render()});
  MP.peer.on('connection',c=>{
    MP.connections.push(c);
    c.on('open',()=>c.send({type:'state',state:netState()}));
    c.on('data',m=>handleHostMessage(c,m));
  });
  MP.peer.on('error',e=>{if(e.type==='unavailable-id'){S.gameCode=makeCode();S.peerId='ubi-es-'+S.gameCode;try{MP.peer.destroy()}catch(_e){}initHostNetwork()}else alert('Netværksfejl: '+e.type)});
}
function handleHostMessage(c,m){
  if(!m||!m.type)return;
  if(m.type==='join'){
    let name=(m.name||'Spiller').trim().slice(0,24)||'Spiller';
    let id=Math.max(0,...S.players.map(p=>p.id))+1;
    S.players.push({id,name,fixed:CATS[(id-1)%CATS.length],joker:null,jokerTopic:'',ready:false,lp:0,qp:0,jokers:2,faret:false});
    S.order.push(id); c.playerId=id; c.send({type:'joined',playerId:id}); save();render();broadcastState();
  }
  if(m.type==='ready'&&c.playerId){let p=playerById(c.playerId);if(p){p.ready=!!m.ready && validateJokerTopic(p.jokerTopic,p.fixed).ok;save();render();broadcastState()}}
  if(m.type==='profile'&&c.playerId){let p=playerById(c.playerId);if(p){if(m.name)p.name=String(m.name).slice(0,24);if(CATS.includes(m.fixed))p.fixed=m.fixed;if(typeof m.jokerTopic==='string')p.jokerTopic=m.jokerTopic.trim().slice(0,80);p.ready=false;save();render();broadcastState()}}
  if(m.type==='playerAction'&&c.playerId&&current()&&c.playerId===current().id){applyPlayerAction(m.action,m.data||{});broadcastState()}
}
function joinMultiplayer(){
  let code=(document.getElementById('joinCode')?.value||'').replace(/\D/g,'').slice(0,4);
  let name=(document.getElementById('joinName')?.value||'').trim()||'Spiller';
  if(code.length!==4){alert('Indtast den 4-cifrede spilkode.');return}
  if(typeof Peer==='undefined'){alert('Multiplayer-netværket kunne ikke indlæses.');return}
  S=fresh();S.netRole='client';S.gameCode=code;S.screen='lobby';S._joinName=name;
  MP.peer=new Peer();
  MP.peer.on('open',()=>{let c=MP.peer.connect('ubi-es-'+code,{reliable:true});MP.hostConn=c;c.on('open',()=>c.send({type:'join',name}));c.on('data',handleClientMessage);c.on('close',()=>{if(S.netRole==='client')resetClientSession('Spillet er afsluttet, eller forbindelsen til spilstyreren er lukket.')})});
  MP.peer.on('error',e=>alert('Kunne ikke forbinde til spillet. Kontrollér spilkoden. ('+e.type+')'));
  render();
}

function resetClientSession(message){
  try{localStorage.removeItem('ubi_es_v02')}catch(e){}
  try{sessionStorage.clear()}catch(e){}
  if(MP.hostConn){try{MP.hostConn.close()}catch(e){}}
  if(MP.peer){try{MP.peer.destroy()}catch(e){}}
  MP={peer:null,connections:[],hostConn:null,suppress:false};
  S=fresh();S.screen='home';
  render();
  if(message)setTimeout(()=>alert(message),50);
}

function resetConnectedPlayers(){
  if(!isHost())return;
  MP.connections.filter(c=>c&&c.open).forEach(c=>{try{c.send({type:'gameEnded'})}catch(e){}});
  MP.connections.forEach(c=>{try{c.close()}catch(e){}});
  MP.connections=[];
}

function endMultiplayerForAll(){
  if(!isHost())return;
  let msg={type:'gameEnded'};
  MP.connections.filter(c=>c&&c.open).forEach(c=>{try{c.send(msg)}catch(e){}});
  try{localStorage.removeItem('ubi_es_v02')}catch(e){}
  setTimeout(()=>{
    MP.connections.forEach(c=>{try{c.close()}catch(e){}});
    if(MP.peer){try{MP.peer.destroy()}catch(e){}}
    MP={peer:null,connections:[],hostConn:null,suppress:false};
    S=fresh();S.screen='home';render();
  },250);
}

function handleClientMessage(m){
  if(!m)return;
  if(m.type==='gameEnded'){resetClientSession('Spilstyreren har afsluttet spillet.');return}
  if(m.type==='joined'){S.myPlayerId=m.playerId;save()}
  if(m.type==='state'){
    let role=S.netRole,my=S.myPlayerId,code=S.gameCode;
    MP.suppress=true; S=m.state; S.netRole=role;S.myPlayerId=my;S.gameCode=code||S.gameCode; MP.suppress=false;
    localStorage.setItem('ubi_es_v02',JSON.stringify(S)); render();
  }
}

 p.name=(document.getElementById('hostPlayerName')?.value||p.name).trim()||'Spiller 1';

 p.jokerTopic=(document.getElementById('hostPlayerJokerTopic')?.value||p.jokerTopic||'').trim();
 p.ready=validateJokerTopic(p.jokerTopic,p.fixed).ok;
 save();render();broadcastState();

function validateJokerTopic(topic,category){
 const t=(topic||'').trim().toLowerCase();
 const known={
  'Sport':['manchester united'],
  'Geografi':['aarhus'],
  'Natur & Dyr':['lystfiskeri']
 };
 if(!t)return {ok:false,message:'Du skal vælge et Joker-emne.'};
 if((known[category]||[]).some(k=>t.includes(k)))return {ok:true};
 return {ok:false,message:'Dit emne er for snævert til at vi kan lave kvalificerede spørgsmål.',alternatives:['Manchester United','Aarhus','lystfiskeri']};
}

function die3D(cls,label,colorKey=false){
  const isColor=cls==='color-die', isYellow=cls==='yellow-die';
  const top=isColor?'#f4c62d':isYellow?'#ffdb55':'#ef4a55';
  const front=isColor?'#ff6b18':isYellow?'#f4c62d':'#d92f3d';
  const side=isColor?'#149348':isYellow?'#d4a80d':'#b51f2c';
  // Canonical die patterns on each visible face: top=2, front=6, side=3.
  // Each face has its own symmetric pip layout instead of one shared/random-looking set.
  const pips=isColor?'':`<g class="pipset">
    <!-- top face: 2 -->
    <ellipse class="pip" cx="24" cy="17" rx="2.5" ry="1.8" transform="rotate(30 24 17)"/>
    <ellipse class="pip" cx="40" cy="19" rx="2.5" ry="1.8" transform="rotate(30 40 19)"/>
    <!-- front/left face: 6 -->
    <ellipse class="pip" cx="14" cy="28" rx="2.0" ry="2.6" transform="rotate(-28 14 28)"/>
    <ellipse class="pip" cx="26" cy="35" rx="2.0" ry="2.6" transform="rotate(-28 26 35)"/>
    <ellipse class="pip" cx="14" cy="36" rx="2.0" ry="2.6" transform="rotate(-28 14 36)"/>
    <ellipse class="pip" cx="26" cy="43" rx="2.0" ry="2.6" transform="rotate(-28 26 43)"/>
    <ellipse class="pip" cx="14" cy="44" rx="2.0" ry="2.6" transform="rotate(-28 14 44)"/>
    <ellipse class="pip" cx="26" cy="51" rx="2.0" ry="2.6" transform="rotate(-28 26 51)"/>
    <!-- right face: 3 -->
    <ellipse class="pip" cx="49" cy="29" rx="2.0" ry="2.6" transform="rotate(28 49 29)"/>
    <ellipse class="pip" cx="44" cy="39" rx="2.0" ry="2.6" transform="rotate(28 44 39)"/>
    <ellipse class="pip" cx="39" cy="49" rx="2.0" ry="2.6" transform="rotate(28 39 49)"/>
  </g>`;
  return `<div class="dice-group"><svg class="die-iso ${cls}" viewBox="0 0 64 64" role="img" aria-label="${label}">
    <polygon class="edge" points="32,4 56,18 32,32 8,18" fill="${top}"/>
    <polygon class="edge" points="8,18 32,32 32,60 8,46" fill="${front}"/>
    <polygon class="edge" points="32,32 56,18 56,46 32,60" fill="${side}"/>
    ${pips}
  </svg><div class="dice-label">${label}</div>${colorKey?'<div class="color-key" aria-label="Rød, blå, grøn, gul, lilla og orange"><i></i><i></i><i></i><i></i><i></i><i></i></div>':''}</div>`
} function colorDieHTML(){return die3D('color-die','6-FARVET TERNING',true)} function moveDiceHTML(){return die3D('yellow-die','GUL')+die3D('red-die','RØD')} function turnView(){let p=current();return `<div class="card center"><h2>${S.extraRound?'EKSTRA RUNDE':'DIN TUR'}</h2><div class="dice-stage">${S.round===1?colorDieHTML():moveDiceHTML()}</div><p>${S.round===1?'Slå med den 6-farvede terning.':'Slå med gul og rød terning og flyt brikken. Slå derefter med den 6-farvede terning.'}</p>${S.round===1?'':`<div class="dice-stage">${colorDieHTML()}</div>`}<div class="status">${esc(p.name)} · LP ${p.lp} · QP ${p.qp}<br>Joker ${p.jokers}/2 · Faret vild ${p.faret?'brugt':'klar'}</div>${isActivePhone()?`<button class="btn primary" onclick="playerAction('colorDone')">FARVE SLÅET</button>`:`<p class="note">Kun ${esc(p.name)} kan fortsætte denne tur.</p>`}</div>`}

add('T38',()=>{let a={gameId:'A',status:'SAVED'},b={gameId:'B',status:'SAVED'};let arr=[a,b].filter(g=>g.gameId!=='A');return arr.length+'|'+arr[0].gameId},'1|B');
let results=tests.map(t=>{let actual='';try{actual=t.fn()}catch(e){actual='ERROR: '+e.message}return {id:t.id,pass:actual===t.expected,actual,expected:t.expected}}),passed=results.filter(r=>r.pass).length;window.__UBI_REGRESSION_RESULTS__=results;if(show){main.innerHTML=`<div class="card"><h2>REGRESSIONSTEST T01–T38</h2><div class="${passed===38?'status':'danger'}"><b>${passed}/38 bestået</b></div>${results.map(r=>`<div class="drag"><b>${r.pass?'✓':'✕'} ${r.id}</b>${r.pass?'':`<div class="tiny">Forventet: ${esc(r.expected)}<br>Faktisk: ${esc(r.actual)}</div>`}</div>`).join('')}<button class="btn primary" onclick="render()">LUK</button></div>`}return results}

function showSaveConfirm(){main.innerHTML=`<div class="card center"><h2>GEM OG AFSLUT?</h2><div class="status warn">Spillet gemmes præcis som det står nu og kan fortsættes en anden gang.</div><p>Spillere, LP/QP, runde, tur, kategorier, Joker, Faret vild, historik og eventuel slutrunde bevares.</p><button class="btn gold" onclick="saveAndExitGame()">JA · GEM SPILLET</button><button class="btn ghost" onclick="render()">NEJ · FORTSÆT SPILLET</button></div>`}
function saveAndExitGame(){ensureGameId();let snap=JSON.parse(JSON.stringify(S));snap.status='SAVED';snap.savedAt=new Date().toISOString();snap.savedAtLabel=new Date().toLocaleString('da-DK');snap.screen=S.screen;let games=savedGames().filter(g=>g.gameId!==snap.gameId);games.unshift(snap);writeSavedGames(games);if(isHost()&&S.netRole==='host')resetConnectedPlayers();S=fresh();save();go('home')}
function resumeSavedGame(id){let games=savedGames(),i=games.findIndex(g=>g.gameId===id);if(i<0)return;S=games[i];games.splice(i,1);writeSavedGames(games);S.status='ACTIVE';if(!gameScreen.call(null)||['home','create','lobby','reveal'].includes(S.screen))S.screen='turn';save();render()}
function showAbandonConfirm(){main.innerHTML=`<div class="card center"><h2>AFSLUT SPIL UDEN VINDER?</h2><div class="status danger">Det igangværende spil afsluttes permanent uden en vinder og kan ikke fortsættes bagefter.</div><p>Gem spillet i stedet, hvis I vil kunne fortsætte en anden dag.</p><button class="btn red" onclick="abandonGame()">JA · AFSLUT SPIL</button><button class="btn ghost" onclick="render()">NEJ · FORTSÆT SPILLET</button></div>`}
function abandonGame(){if(isHost()&&S.netRole==='host'){if(confirm('Afslut spillet for alle deltagere?'))endMultiplayerForAll();return}if(confirm('Afslut spillet?')){try{localStorage.removeItem('ubi_es_v02')}catch(e){}S=fresh();render()}}
function confirmDeleteSaved(id){let g=savedGames().find(x=>x.gameId===id);if(!g)return;main.innerHTML=`<div class="card center"><h2>AFSLUT GEMT SPIL UDEN VINDER?</h2><div class="status danger">Det gemte spil afsluttes permanent og kan ikke fortsættes bagefter.</div><button class="btn red" onclick="deleteSavedGame('${id}')">JA · AFSLUT SPIL</button><button class="btn ghost" onclick="go('home')">NEJ · BEHOLD SPILLET</button></div>`}
function deleteSavedGame(id){if(S.netRole==='host'&&S.gameCode){endMultiplayerForAll();return;}writeSavedGames(savedGames().filter(g=>g.gameId!==id));go('home')}

function backFromLobby(){
  if(S.netRole==='host'){
    MP.connections.filter(c=>c&&c.open).forEach(c=>{try{c.send({type:'gameEnded'})}catch(e){}});
    MP.connections.forEach(c=>{try{c.close()}catch(e){}});
    if(MP.peer){try{MP.peer.destroy()}catch(e){}}
    MP={peer:null,connections:[],hostConn:null,suppress:false};
  } else if(S.netRole==='client'){
    if(MP.hostConn){try{MP.hostConn.close()}catch(e){}}
    if(MP.peer){try{MP.peer.destroy()}catch(e){}}
    MP={peer:null,connections:[],hostConn:null,suppress:false};
  }
  try{localStorage.removeItem('ubi_es_v02')}catch(e){}
  S=fresh();S.screen='home';render();
}

function newMultiplayerHost(){
 S=fresh();S.status='NEW';S.screen='lobby';S.netRole='host';
 S.players=[{id:1,name:'Spiller 1',fixed:CATS[0],joker:null,jokerTopic:'',ready:true,lp:0,qp:0,jokers:2,faret:false}];
 S.order=[1];S.myPlayerId=1;save();initHostNetwork();render();
}

function newGameSetup(){S=fresh();save();go('create')}

function demoGame(){S=fresh();S.status='ACTIVE';S.count=4;S.players=['Jens','Peter','Anne','Mette'].map((n,i)=>({id:i+1,name:n,fixed:['Historie','Sport','Musik','Natur & Dyr'][i],joker:null,jokerTopic:'',ready:true,lp:0,qp:0,jokers:2,faret:false}));S.order=[2,3,1,4];startGame()} function resetAll(){localStorage.removeItem('ubi_es_v02');localStorage.removeItem('ubi_es_v02_saved_games');S=fresh();render()} function newGame(){S=fresh();save();go('home')}
render();
