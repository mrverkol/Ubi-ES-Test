.mp-note{font-size:12px;background:#eef7ff;border-radius:9px;padding:9px;margin:8px 0}</style><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script></head><body><div class="app"><header class="top"><span>☰</span><span class="brand">UBI ES</span><span class="ver" id="topLabel">v0.3.0 Multiplayer Test</span></header><div id="scorebar" class="scorebar hidden"></div><main class="main" id="main"></main><nav class="bottom hidden" id="bottom"><button onclick="showOverlay('score')"><b>▦</b>Score</button><button onclick="showOverlay('history')"><b>◷</b>Historik</button><button onclick="showOverlay('rules')"><b>▣</b>Regler</button><button onclick="showOverlay('game')"><b>⚙</b>Spil</button></nav></div><script>
const CATS=['Geografi','Historie','Sport','Musik','Film','TV & Serier','Natur & Dyr','Videnskab & Teknologi','Mad & Drikke','Kultur & Litteratur','Samfund & Verden','Almen viden'];
const COLORS=[['🔴','Rød'],['🔵','Blå'],['🟢','Grøn'],['🟡','Gul'],['🟣','Lilla'],['🟠','Orange']];
const BASE={
'Geografi':[['Hvad er Danmarks hovedstad?','København'],['Hvilket land ligger Oslo i?','Norge']],
'Historie':[['I hvilket år sluttede 2. verdenskrig i Europa?','1945'],['Hvem var Danmarks konge under størstedelen af 2. verdenskrig?','Christian 10.']],
'Sport':[['Hvor mange spillere starter et fodboldhold med på banen?','11'],['Hvilken sport forbindes Wimbledon med?','Tennis']],
'Musik':[['Hvilket instrument har normalt 88 tangenter?','Klaver'],['Hvilken gruppe udgav sangen “Dancing Queen”?','ABBA']],
'Film':[['Hvem instruerede filmen Titanic fra 1997?','James Cameron'],['Hvad hedder troldmandsskolen i Harry Potter-filmene?','Hogwarts']],
'TV & Serier':[['Hvad hedder kaffebaren i serien Friends?','Central Perk'],['Hvilken familie er central i The Simpsons?','Familien Simpson']],
'Natur & Dyr':[['Hvad er verdens største nulevende landdyr?','Afrikansk elefant'],['Hvilket dyr udvikler sig fra en haletudse?','Frø']],
'Videnskab & Teknologi':[['Hvilken planet er nærmest Solen?','Merkur'],['Hvad står WWW for?','World Wide Web']],
'Mad & Drikke':[['Hvilken frugt er hovedingrediensen i guacamole?','Avocado'],['Hvilket land forbindes pizza traditionelt med?','Italien']],
'Kultur & Litteratur':[['Hvem skrev eventyret Den lille havfrue?','H.C. Andersen'],['Hvem skrev Romeo og Julie?','William Shakespeare']],
'Samfund & Verden':[['Hvilken valuta bruges i Tyskland?','Euro'],['Hvad står FN for på dansk?','De Forenede Nationer']],
'Almen viden':[['Hvor mange dage er der normalt i et skudår?','366'],['Hvor mange minutter er der i en time?','60']]
};
const JOKER={
'Formel 1':[['Hvad står F1 for?','Formel 1'],['Hvilket flag markerer normalt afslutningen på et løb?','Det ternede flag'],['Hvilken dansk kører debuterede i Formel 1 i 2014?','Kevin Magnussen'],['Hvad kaldes første startposition?','Pole position'],['Hvilken konstruktør forbindes med den stejlende hest?','Ferrari'],['På hvilken bybane køres Monaco Grand Prix?','Circuit de Monaco']],
'Premier League':[['I hvilket land spilles Premier League?','England'],['Hvilken sport spilles i Premier League?','Fodbold'],['Hvilken by kommer Liverpool FC fra?','Liverpool'],['Hvad kaldes Manchester Uniteds stadion?','Old Trafford'],['Hvilken klub spiller hjemmekampe på Anfield?','Liverpool FC'],['Hvilken klub forbindes med stadionet Stamford Bridge?','Chelsea']],
'Beatles':[['Fra hvilken by kom The Beatles?','Liverpool'],['Hvor mange medlemmer var der i den klassiske Beatles-besætning?','4'],['Hvad hed Beatles-medlemmet med fornavnet Ringo?','Ringo Starr'],['Hvem skrev og sang Imagine efter Beatles?','John Lennon'],['Hvad hedder albummet med fodgængerfeltet på coveret?','Abbey Road'],['Hvilket årti gik The Beatles i opløsning?','1970’erne']]
};
let timerId=null, seconds=30;
function fresh(){return {gameId:null,status:'NEW',screen:'home',netRole:null,peerId:null,myPlayerId:null,gameCode:'',mode:'Individuelt',count:4,players:[],order:[],active:0,round:1,activeCats:[],colorMap:[],turnCat:null,turnJoker:false,level:1,qRole:'player',currentQ:null,usedQ:{},turn:{ownQP:0,contactQP:0,lp:0,contactReached:true},history:[],finalRound:false,finalRoundEndIndex:null,extraRound:false,extraPlayers:[],finished:false};}
function migrateQPGame(g){
  if(!g||typeof g!=='object')return g;
  (g.players||[]).forEach(p=>{if(p.qp==null&&p.sp!=null)p.qp=p.sp;delete p.sp});
  if(g.mode==='sp')g.mode='qp';
  return g;
}
let S=migrateQPGame(JSON.parse(localStorage.getItem('ubi_es_v02')||'null'))||fresh();
function savedGames(){try{let games=JSON.parse(localStorage.getItem('ubi_es_v02_saved_games')||'[]');let migrated=games.map(migrateQPGame);if(JSON.stringify(migrated)!==JSON.stringify(games))localStorage.setItem('ubi_es_v02_saved_games',JSON.stringify(migrated));return migrated}catch(e){return []}}
function writeSavedGames(games){localStorage.setItem('ubi_es_v02_saved_games',JSON.stringify(games))}
function ensureGameId(){if(!S.gameId)S.gameId='G'+Date.now()+'_'+Math.random().toString(36).slice(2,8)}
function savedGameSummary(g){let ps=(g.players||[]).map(p=>`${p.name}: ${p.lp} LP / ${p.qp} QP`).join(' · ');return `<div class="drag"><b>${esc(g.mode||'Spil')} · Runde ${g.round||1}</b><div class="tiny">${esc(ps||'Ingen spillere')}<br>Gemt: ${esc(g.savedAtLabel||'')}</div><button class="btn gold" onclick="resumeSavedGame('${g.gameId}')">FORTSÆT SPIL</button><button class="btn ghost" onclick="confirmDeleteSaved('${g.gameId}')">AFSLUT UDEN VINDER</button></div>`}

let MP={peer:null,connections:[],hostConn:null,suppress:false};
function makeCode(){return String(Math.floor(1000+Math.random()*9000))}
function netState(){let x=JSON.parse(JSON.stringify(S));x.netRole=undefined;x.peerId=undefined;return x}
function broadcastState(){if(S.netRole!=='host')return;let msg={type:'state',state:netState()};MP.connections=MP.connections.filter(c=>c&&c.open);MP.connections.forEach(c=>{try{c.send(msg)}catch(e){}})}
function sendHost(msg){if(MP.hostConn&&MP.hostConn.open)MP.hostConn.send(msg)}
function initHostNetwork(){
  if(typeof Peer==='undefined'){alert('Multiplayer-netværket kunne ikke indlæses. Kontrollér internetforbindelsen.');return}
  S.gameCode=makeCode(); S.netRole='host'; S.peerId='ubi-es-'+S.gameCode;
  MP.peer=new Peer(S.peerId);
  MP.peer.on('open',()=>{save();render()});
  MP.peer.on('connection',c=>{
    MP.connections.push(c);
    c.on('open',()=>c.send({type:'state',state:netState()}));
    c.on('data',m=>handleHostMessage(c,m));
  });
  MP.peer.on('error',e=>{if(e.type==='unavailable-id'){S.gameCode=makeCode();S.peerId='ubi-es-'+S.gameCode;try{MP.peer.destroy()}catch(_e){}initHostNetwork()}else alert('Netværksfejl: '+e.type)});
}
function handleHostMessage(c,m){
  if(!m||!m.type)return;
  if(m.type==='join'){
    let name=(m.name||'Spiller').trim().slice(0,24)||'Spiller';
    let id=Math.max(0,...S.players.map(p=>p.id))+1;
    S.players.push({id,name,fixed:CATS[(id-1)%CATS.length],joker:Object.keys(JOKER)[(id-1)%Object.keys(JOKER).length],ready:false,lp:0,qp:0,jokers:2,faret:false});
    S.order.push(id); c.playerId=id; c.send({type:'joined',playerId:id}); save();render();broadcastState();
  }
  if(m.type==='ready'&&c.playerId){let p=playerById(c.playerId);if(p){p.ready=!!m.ready;save();render();broadcastState()}}
  if(m.type==='profile'&&c.playerId){let p=playerById(c.playerId);if(p){if(m.name)p.name=String(m.name).slice(0,24);if(CATS.includes(m.fixed))p.fixed=m.fixed;if(Object.keys(JOKER).includes(m.joker))p.joker=m.joker;p.ready=false;save();render();broadcastState()}}
}
function joinMultiplayer(){
  let code=(document.getElementById('joinCode')?.value||'').replace(/\D/g,'').slice(0,4);
  let name=(document.getElementById('joinName')?.value||'').trim()||'Spiller';
  if(code.length!==4){alert('Indtast den 4-cifrede spilkode.');return}
  if(typeof Peer==='undefined'){alert('Multiplayer-netværket kunne ikke indlæses.');return}
  S=fresh();S.netRole='client';S.gameCode=code;S.screen='lobby';S._joinName=name;
  MP.peer=new Peer();
  MP.peer.on('open',()=>{let c=MP.peer.connect('ubi-es-'+code,{reliable:true});MP.hostConn=c;c.on('open',()=>c.send({type:'join',name}));c.on('data',handleClientMessage);c.on('close',()=>alert('Forbindelsen til spilstyreren blev afbrudt.'))});
  MP.peer.on('error',e=>alert('Kunne ikke forbinde til spillet. Kontrollér spilkoden. ('+e.type+')'));
  render();
}
function handleClientMessage(m){
  if(!m)return;
  if(m.type==='joined'){S.myPlayerId=m.playerId;save()}
  if(m.type==='state'){
    let role=S.netRole,my=S.myPlayerId,code=S.gameCode;
    MP.suppress=true; S=m.state; S.netRole=role;S.myPlayerId=my;S.gameCode=code||S.gameCode; MP.suppress=false;
    localStorage.setItem('ubi_es_v02',JSON.stringify(S)); render();
  }
}
function clientLobbyView(){
 let me=playerById(S.myPlayerId);
 return `<div class="card center"><span class="pill">MULTIPLAYER TEST</span><div class="code">${esc(S.gameCode||'....')}</div><p>${me?'Forbundet som <b>'+esc(me.name)+'</b>':'Forbinder til spilstyreren…'}</p></div>`+
 (me?`<div class="card"><h3>MIN OPSÆTNING</h3><label>Navn</label><input id="mpName" class="input" value="${esc(me.name)}"><label>Fast kategori</label><select id="mpFixed" class="input">${CATS.map(c=>`<option ${c===me.fixed?'selected':''}>${c}</option>`).join('')}</select><label>Personlig Joker</label><select id="mpJoker" class="input">${Object.keys(JOKER).map(j=>`<option ${j===me.joker?'selected':''}>${j}</option>`).join('')}</select><button class="btn ghost" onclick="sendHost({type:'profile',name:document.getElementById('mpName').value,fixed:document.getElementById('mpFixed').value,joker:document.getElementById('mpJoker').value})">GEM OPSÆTNING</button><button class="btn ${me.ready?'ghost':'green'}" onclick="sendHost({type:'ready',ready:${!me.ready}})">${me.ready?'FORTRYD KLAR':'JEG ER KLAR'}</button></div>`:'')+
 `<div class="card"><h3>SPILLERE</h3>${S.players.map(p=>`<div class="p"><b>${esc(p.name)}</b><span class="${p.ready?'ok':''}">${p.ready?'✓ Klar':'Ikke klar'}</span></div>`).join('')}</div>`;
}

const main=document.getElementById('main'), scorebar=document.getElementById('scorebar'), bottom=document.getElementById('bottom'), topLabel=document.getElementById('topLabel');
function save(){localStorage.setItem('ubi_es_v02',JSON.stringify(S));if(!MP.suppress&&S.netRole==='host')setTimeout(broadcastState,0)} function go(x){stopTimer();S.screen=x;save();render()} function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function gameScreen(){return ['turn','color','category','difficulty','question','answer','result','location','lp','contactDifficulty','contactQuestion','contactAnswer','turnEnd','finalCheck','extra','winner'].includes(S.screen)}
function current(){return S.players[S.active]||null} function playerById(id){return S.players.find(p=>p.id===id)}
function renderChrome(){let g=gameScreen();scorebar.classList.toggle('hidden',!g);bottom.classList.toggle('hidden',!g);topLabel.textContent=g?`Runde ${S.round}`:'v0.3.0 Multiplayer Test';if(g&&current()){scorebar.innerHTML=S.players.map((p,i)=>`<div class="score-player ${i===S.active?'active':''}"><div class="score-name">${esc(p.name)}</div><div class="score-points">LP <b>${p.lp}</b> · QP <b>${p.qp}</b></div></div>`).join('')}}
function render(){renderChrome();let h='';if(S.finalRound&&gameScreen()&&!['winner'].includes(S.screen))h+=`<div class="banner">⚑ SLUTRUNDE – runden færdiggøres, så alle får lige mange ture</div>`;
if(S.screen==='home'){let sg=savedGames();h+=`<div class="card center"><h1>UBI ES</h1><h3>VIDEN · STRATEGI · SAMARBEJDE</h3><p class="tiny">Mobil ledsager til det fysiske UBI ES-spil</p>${S.players.length&&S.status!=='SAVED'&&!S.finished?`<button class="btn gold" onclick="go('turn')">FORTSÆT AKTIVT SPIL</button>`:''}<button class="btn primary" onclick="newMultiplayerHost()">OPRET MULTIPLAYER-SPIL</button><div class="card" style="margin-top:10px"><b>TILSLUT SPIL</b><input id="joinCode" class="input" inputmode="numeric" maxlength="4" placeholder="4-cifret spilkode"><input id="joinName" class="input" placeholder="Dit navn"><button class="btn green" onclick="joinMultiplayer()">TILSLUT</button></div><button class="btn ghost" onclick="newGameSetup()">LOKAL TEST</button><button class="btn ghost" onclick="demoGame()">HURTIG TEST MED 4 SPILLERE</button>${sg.length?`<h3>GEMTE SPIL</h3>${sg.map(savedGameSummary).join('')}`:''}</div>`;}
if(S.screen==='create')h+=createView(); if(S.screen==='lobby')h+=(S.netRole==='client'?clientLobbyView():lobbyView()); if(S.screen==='reveal')h+=revealView(); if(S.screen==='turn')h+=turnView(); if(S.screen==='color')h+=colorView(); if(S.screen==='category')h+=categoryView(); if(S.screen==='difficulty'||S.screen==='contactDifficulty')h+=difficultyView(S.screen==='contactDifficulty'); if(S.screen==='question'||S.screen==='contactQuestion')h+=questionView(S.screen==='contactQuestion'); if(S.screen==='answer'||S.screen==='contactAnswer')h+=answerView(S.screen==='contactAnswer'); if(S.screen==='result')h+=resultView(); if(S.screen==='location')h+=locationView(); if(S.screen==='lp')h+=lpView(); if(S.screen==='turnEnd')h+=turnEndView(); if(S.screen==='finalCheck')h+=finalCheckView(); if(S.screen==='extra')h+=extraView(); if(S.screen==='winner')h+=winnerView(); main.innerHTML=h; if(S.screen==='question'||S.screen==='contactQuestion')startTimer();}
function createView(){return `<div class="card"><h2>OPRET SPIL</h2><label>Spilstyrer</label><input id="host" class="input" value="Jens"><p><b>Spilform</b></p><div class="row"><button class="btn ${S.mode==='Individuelt'?'primary':'ghost'}" onclick="S.mode='Individuelt';render()">Individuelt</button><button class="btn ${S.mode==='Hold'?'primary':'ghost'}" onclick="S.mode='Hold';render()">Hold</button></div><p><b>Antal spillere/hold</b></p><div class="row">${[2,3,4].map(n=>`<button class="btn ${S.count===n?'primary':'ghost'}" onclick="S.count=${n};render()">${n}</button>`).join('')}</div><button class="btn green" onclick="makeLobby()">OPRET SPIL</button></div>`}
function makeLobby(){let host=document.getElementById('host').value.trim()||'Jens';S.players=Array.from({length:S.count},(_,i)=>({id:i+1,name:i===0?host:['Peter','Anne','Mette'][i-1]||`Spiller ${i+1}`,fixed:CATS[i%12],joker:['Formel 1','Premier League','Beatles','Formel 1'][i],ready:false,lp:0,qp:0,jokers:2,faret:false}));S.order=S.players.map(p=>p.id);go('lobby')}
function lobbyView(){return `<div class="card center"><span class="pill">SPILKODE</span><div class="code">${S.gameCode}</div><p class="tiny">Åbn samme webadresse på de andre telefoner og indtast spilkoden.</p></div><div class="card"><h2>SPILLERE · MULTIPLAYER</h2>${S.players.map((p,i)=>`<div class="p"><b>${i===0?'👑 ':''}${esc(p.name)}</b><span class="${p.ready?'ok':''}">${p.ready?'✓ Klar':'Ikke klar'}</span></div>`).join('')}</div>${S.players.map((p,i)=>`<div class="card"><h3>${esc(p.name)} · OPSÆTNING</h3><label>Navn</label><input class="input" value="${esc(p.name)}" onchange="setP(${p.id},'name',this.value)"><label>Fast kategori</label><select class="input" onchange="setP(${p.id},'fixed',this.value)">${CATS.map(c=>`<option ${c===p.fixed?'selected':''}>${c}</option>`).join('')}</select><label>Personlig Joker</label><select class="input" onchange="setP(${p.id},'joker',this.value)">${Object.keys(JOKER).map(j=>`<option ${j===p.joker?'selected':''}>${j}</option>`).join('')}</select><div class="status">✓ Joker klar · 6 niveauer</div><button class="btn ${p.ready?'ghost':'green'}" onclick="toggleReady(${p.id})">${p.ready?'FORTRYD KLAR':'JEG ER KLAR'}</button></div>`).join('')}<div class="card"><h3>SPILLERÆKKEFØLGE</h3><p class="tiny">Registrér resultatet af det fysiske startkast.</p>${S.order.map((id,i)=>{let p=playerById(id);return `<div class="drag">${i+1}. ${esc(p.name)} <span style="float:right"><button class="mini" onclick="moveOrder(${i},-1)">↑</button> <button class="mini" onclick="moveOrder(${i},1)">↓</button></span></div>`}).join('')}<button class="btn green" ${S.players.every(p=>p.ready)?'':'disabled'} onclick="startGame()">START SPIL</button></div>`}
function setP(id,k,v){playerById(id)[k]=v;playerById(id).ready=false;save();render()} function toggleReady(id){let p=playerById(id);p.ready=!p.ready;save();render()} function moveOrder(i,d){let j=i+d;if(j<0||j>=S.order.length)return;[S.order[i],S.order[j]]=[S.order[j],S.order[i]];save();render()}
function startGame(){if(S.netRole==='client')return;ensureGameId();S.status='ACTIVE';let unique=[...new Set(S.players.map(p=>p.fixed))], rest=CATS.filter(c=>!unique.includes(c));while(unique.length<6){let k=Math.floor(Math.random()*rest.length);unique.push(rest.splice(k,1)[0])}S.activeCats=unique.slice(0,6).sort(()=>Math.random()-.5);S.colorMap=COLORS.map((c,i)=>({emoji:c[0],name:c[1],cat:S.activeCats[i]}));S.active=0;S.round=1;S.history.push('Spillet startet');go('reveal')}
function revealView(){return `<div class="card"><h2 class="center">DAGENS 6 KATEGORIER</h2>${S.colorMap.map(x=>`<div class="drag catrow"><span>${x.emoji} ${esc(x.name)}</span><b>${esc(x.cat)}</b></div>`).join('')}<button class="btn primary" onclick="go('turn')">KLAR · START RUNDE 1</button></div>`}
function die3D(cls,label,colorKey=false){
  const isColor=cls==='color-die', isYellow=cls==='yellow-die';
  const top=isColor?'#f4c62d':isYellow?'#ffdb55':'#ef4a55';
  const front=isColor?'#ff6b18':isYellow?'#f4c62d':'#d92f3d';
  const side=isColor?'#149348':isYellow?'#d4a80d':'#b51f2c';
  // Canonical die patterns on each visible face: top=2, front=6, side=3.
  // Each face has its own symmetric pip layout instead of one shared/random-looking set.
  const pips=isColor?'':`<g class="pipset">
    <!-- top face: 2 -->
    <ellipse class="pip" cx="24" cy="17" rx="2.5" ry="1.8" transform="rotate(30 24 17)"/>
    <ellipse class="pip" cx="40" cy="19" rx="2.5" ry="1.8" transform="rotate(30 40 19)"/>
    <!-- front/left face: 6 -->
    <ellipse class="pip" cx="14" cy="28" rx="2.0" ry="2.6" transform="rotate(-28 14 28)"/>
    <ellipse class="pip" cx="26" cy="35" rx="2.0" ry="2.6" transform="rotate(-28 26 35)"/>
    <ellipse class="pip" cx="14" cy="36" rx="2.0" ry="2.6" transform="rotate(-28 14 36)"/>
    <ellipse class="pip" cx="26" cy="43" rx="2.0" ry="2.6" transform="rotate(-28 26 43)"/>
    <ellipse class="pip" cx="14" cy="44" rx="2.0" ry="2.6" transform="rotate(-28 14 44)"/>
    <ellipse class="pip" cx="26" cy="51" rx="2.0" ry="2.6" transform="rotate(-28 26 51)"/>
    <!-- right face: 3 -->
    <ellipse class="pip" cx="49" cy="29" rx="2.0" ry="2.6" transform="rotate(28 49 29)"/>
    <ellipse class="pip" cx="44" cy="39" rx="2.0" ry="2.6" transform="rotate(28 44 39)"/>
    <ellipse class="pip" cx="39" cy="49" rx="2.0" ry="2.6" transform="rotate(28 39 49)"/>
  </g>`;
  return `<div class="dice-group"><svg class="die-iso ${cls}" viewBox="0 0 64 64" role="img" aria-label="${label}">
    <polygon class="edge" points="32,4 56,18 32,32 8,18" fill="${top}"/>
    <polygon class="edge" points="8,18 32,32 32,60 8,46" fill="${front}"/>
    <polygon class="edge" points="32,32 56,18 56,46 32,60" fill="${side}"/>
    ${pips}
  </svg><div class="dice-label">${label}</div>${colorKey?'<div class="color-key" aria-label="Rød, blå, grøn, gul, lilla og orange"><i></i><i></i><i></i><i></i><i></i><i></i></div>':''}</div>`
} function colorDieHTML(){return die3D('color-die','6-FARVET TERNING',true)} function moveDiceHTML(){return die3D('yellow-die','GUL')+die3D('red-die','RØD')} function turnView(){let p=current();return `<div class="card center"><h2>${S.extraRound?'EKSTRA RUNDE':'DIN TUR'}</h2><div class="dice-stage">${S.round===1?colorDieHTML():moveDiceHTML()}</div><p>${S.round===1?'Slå med den 6-farvede terning.':'Slå med gul og rød terning og flyt brikken. Slå derefter med den 6-farvede terning.'}</p>${S.round===1?'':`<div class="dice-stage">${colorDieHTML()}</div>`}<div class="status">${esc(p.name)} · LP ${p.lp} · QP ${p.qp}<br>Joker ${p.jokers}/2 · Faret vild ${p.faret?'brugt':'klar'}</div><button class="btn primary" onclick="go('color')">FARVE SLÅET</button></div>`}
function colorView(){return `<div class="card center"><h2>HVILKEN FARVE?</h2><div class="grid6">${S.colorMap.map(x=>`<button class="lvl" onclick="chooseCat('${esc(x.cat)}')">${x.emoji}</button>`).join('')}</div><p class="tiny">Tryk kun på farven – terningkastet registreres ikke.</p></div>`} function chooseCat(c){S.turnCat=c;S.turnJoker=false;go('category')}
function categoryColor(cat){if(S.turnJoker)return '#7227a8';let x=(S.colorMap||[]).find(v=>v.cat===cat);return x?({'Rød':'#d92f3d','Blå':'#1782d4','Grøn':'#149348','Gul':'#f4c62d','Lilla':'#7a35ae','Orange':'#ff6b18'}[x.name]||'#ff6b18'):'#ff6b18'} function categoryView(){let p=current();return `<div class="card center"><div class="turn-category" style="background:${categoryColor(S.turnCat)}">${esc(S.turnCat).toUpperCase()}</div><button class="btn primary" onclick="go('difficulty')">FORTSÆT MED ${esc(S.turnCat).toUpperCase()}</button><button class="btn joker-btn" ${p.jokers<1?'disabled':''} onclick="useJoker()">★ BRUG JOKER · ${esc(p.joker)}</button><p class="tiny">${p.jokers} Joker${p.jokers===1?'':'e'} tilbage</p></div>`} function useJoker(){let p=current();if(!p.jokers)return;p.jokers--;S.turnCat=p.joker;S.turnJoker=true;S.history.push(`${p.name} brugte Joker: ${p.joker}`);go('difficulty')}
function difficultyView(contact){return `<div class="card center"><h2>${contact?'KONTAKTENS SPØRGSMÅL':esc(S.turnCat).toUpperCase()}</h2><p>${esc(S.turnCat)} · vælg sværhedsgrad</p><div class="grid6">${[1,2,3,4,5,6].map(n=>`<button class="lvl" onclick="pickLevel(${n},${contact})">${n}<small>${n} QP</small></button>`).join('')}</div><p class="tiny">1 Meget let · 2 Let · 3 Middel · 4 Svær · 5 Meget svær · 6 Ekspert</p></div>`}
function pickLevel(n,contact){S.level=n;S.qRole=contact?'contact':'player';S.currentQ=pickQuestion(S.turnCat,n,contact);go(contact?'contactQuestion':'question')}
function pickQuestion(cat,lvl,contact){let arr=JOKER[cat]?[JOKER[cat][lvl-1],JOKER[cat][(lvl)%6]]:BASE[cat]||BASE['Almen viden'];let key=`${cat}|${lvl}|${S.round}|${current().id}`;let idx=contact?1:0;let q=arr[idx]||arr[0];return {q:q[0],a:q[1],key:key+'|'+idx}}
function questionView(contact){return `<div class="card"><span class="pill">${esc(S.turnCat).toUpperCase()} · NIVEAU ${S.level}</span><h2 style="margin-top:24px">${esc(S.currentQ.q)}</h2><div class="timer"><div><b id="secs">30</b><br><span class="tiny">sekunder</span></div></div><p class="tiny center">Facit er skjult på alle telefoner.</p><button class="btn primary" onclick="revealAnswer(${contact})">SVAR AFGIVET</button></div>`}
function startTimer(){stopTimer();seconds=30;timerId=setInterval(()=>{seconds--;let e=document.getElementById('secs');if(e)e.textContent=seconds;if(seconds<=0){stopTimer();revealAnswer(S.screen==='contactQuestion')}},1000)} function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}} function revealAnswer(contact){stopTimer();go(contact?'contactAnswer':'answer')}
function answerView(contact){return `<div class="card center"><span class="pill">${esc(S.turnCat).toUpperCase()} · NIVEAU ${S.level}</span><div class="answer">KORREKT SVAR<br><br>${esc(S.currentQ.a)}</div><p>${contact?'Svarede kontakten':'Var '+esc(current().name)+'s svar'} korrekt?</p><div class="row"><button class="btn green" onclick="judge(true,${contact})">✓ KORREKT</button><button class="btn red" onclick="judge(false,${contact})">✕ FORKERT</button></div><p class="tiny">Kun Spilstyrer bruger knapperne.</p></div>`}
function judge(ok,contact){let p=current(),pts=ok?S.level:0;if(contact){p.qp+=pts;S.turn.contactQP=pts;S.history.push(`${p.name}: kontakt ${ok?'+ '+pts+' QP':'forkert'}`);go('turnEnd')}else{p.qp+=pts;S.turn.ownQP=pts;S.history.push(`${p.name}: eget spørgsmål ${ok?'+ '+pts+' QP':'forkert'}`);go('result')}}
function resultView(){return `<div class="card center"><h2>${S.turn.ownQP?'✓ KORREKT':'✕ FORKERT'}</h2><div class="big">+${S.turn.ownQP} QP</div><p>QP i alt: <b>${current().qp}</b></p><button class="btn primary" onclick="go('location')">VIDERE TIL KONTAKT</button></div>`}
function locationView(){let p=current();return `<div class="card center"><div class="big">☎</div><h2>FIND KONTAKTEN</h2><p>Placér brikken og ring til kontakten. Appen beregner ikke LP.</p><button class="btn faret-btn" ${p.faret?'disabled':''} onclick="useFaret()">★ FARET VILD ${p.faret?'· BRUGT':''}</button><button class="btn green" onclick="go('lp')">📍 KONTAKT LOKALISERET</button><button class="btn ghost" onclick="noContact()">INGEN KONTAKT OPNÅET</button></div>`} function useFaret(){let p=current();p.faret=true;S.history.push(`${p.name} brugte Faret vild`);save();render()} function noContact(){S.turn.contactReached=false;S.turn.lp=0;S.history.push(`${current().name}: ingen kontakt, 0 LP`);go('turnEnd')}
function lpView(){let max=current().faret?8:12;return `<div class="card center"><h2>LOCATION POINT</h2><p>Hvor mange LP fik ${esc(current().name)}?</p>${current().faret?'<div class="banner">★ FARET VILD ER BRUGT – MAKS. 8 LP</div>':''}<input id="lpInput" type="number" min="0" max="${max}" value="7" class="input" style="font-size:28px;text-align:center"><p class="tiny">Indtast det endelige LP-resultat efter de fysiske regler.${current().faret?' Faret vild giver maks. 8 LP.':''}</p><div id="lpWarning" class="banner hidden">FARET VILD ER BRUGT – DER KAN MAKS. GIVES 8 LP.</div><button class="btn green" onclick="approveLP()">GODKEND LP</button></div>`} function approveLP(){let raw=Number(document.getElementById('lpInput').value)||0,p=current();if(p.faret&&raw>8){let w=document.getElementById('lpWarning');if(w)w.classList.remove('hidden');return}let n=Math.max(0,Math.min(p.faret?8:12,raw));p.lp+=n;S.turn.lp=n;S.history.push(`${p.name}: +${n} LP${p.faret?' (Faret vild)':''}`);go('contactDifficulty')}
function turnEndView(){let p=current();return `<div class="card center"><h2>TUR AFSLUTTET</h2><div class="turnsum"><span>Eget spørgsmål</span><b>+${S.turn.ownQP} QP</b><span>Kontaktspørgsmål</span><b>+${S.turn.contactQP} QP</b><span>Location</span><b>+${S.turn.lp} LP</b></div><h2>LP ${p.lp} · QP ${p.qp}</h2>${threshold(p)?`<div class="banner">${esc(p.name)} har nået ${p.lp>=36?'36 LP':'36 QP'}.</div>`:''}<button class="btn primary" onclick="finishTurn()">${isRoundEnd()?'AFSLUT RUNDE':'START NÆSTE TUR'}</button></div>`}
function threshold(p){return p.lp>=36||p.qp>=36} function isRoundEnd(){return S.active===S.players.length-1}
function finishTurn(){if(threshold(current())&&!S.finalRound){S.finalRound=true;S.history.push(`Slutrunde aktiveret af ${current().name}`)}S.turn={ownQP:0,contactQP:0,lp:0,contactReached:true};if(S.extraRound){let ids=S.extraPlayers;let pos=ids.indexOf(current().id);if(pos===ids.length-1){go('finalCheck');return}else{S.active=S.players.findIndex(p=>p.id===ids[pos+1]);go('turn');return}}if(isRoundEnd()){if(S.finalRound){go('finalCheck');return}S.active=0;S.round++;go('turn')}else{S.active++;go('turn')}}
function finalCheckView(){return `<div class="card center"><h2>RUNDEN ER FÆRDIG</h2><p>Alle spillere har nu haft lige mange ture.</p>${scoreTable()}<div class="note">Tjek stillingen, inden spillet afgøres.</div><button class="btn green" onclick="calculateWinner()">FIND VINDER</button><button class="btn ghost" onclick="showOverlay('history')">SE HISTORIK</button></div>`}
function poss(name){return /[sxz]$/i.test(name)?name+"'":name+'s'}
function namesText(ps){let a=ps.map(p=>p.name);return a.length<2?(a[0]||''):a.length===2?`${a[0]} og ${a[1]}`:`${a.slice(0,-1).join(', ')} og ${a[a.length-1]}`}
function evaluateWinner(players,eligibleIds=null){let scope=eligibleIds?players.filter(p=>eligibleIds.includes(p.id)):players.slice(),candidates=scope.filter(threshold);if(!candidates.length)return {type:'continue',text:'',ids:[]};if(candidates.length===1){let w=candidates[0],reached=w.lp>=36&&w.qp>=36?'36 i både LP og QP':w.lp>=36?'36 LP':'36 QP';return {type:'winner',winner:w,ids:[w.id],text:`${w.name} var den eneste spiller, der nåede ${reached}, og vinder spillet.`}}
let both=candidates.filter(p=>p.lp>=36&&p.qp>=36);if(both.length===1){let w=both[0];return {type:'winner',winner:w,ids:[w.id],text:`${w.name} var den eneste spiller, der nåede 36 i både LP og QP, og vinder derfor spillet.`}}
let pool=both.length?both:candidates, mode=both.length?'both':(pool.every(p=>p.qp>=36&&p.lp<36)?'qp':pool.every(p=>p.lp>=36&&p.qp<36)?'lp':'mixed');let values=pool.map(p=>({p,v:mode==='both'?Math.min(p.lp,p.qp):mode==='qp'?p.lp:mode==='lp'?p.qp:(p.lp>=36?p.qp:p.lp)})),max=Math.max(...values.map(x=>x.v)),tied=values.filter(x=>x.v===max).map(x=>x.p),allNames=namesText(pool);
if(tied.length===1){let w=tied[0],text='';if(mode==='both'){if(pool.length===2){let o=pool.find(p=>p.id!==w.id);text=`${allNames} nåede begge 36 i både LP og QP. Derfor blev deres laveste pointtal sammenlignet. ${poss(w.name)} laveste pointtal var ${Math.min(w.lp,w.qp)} mod ${poss(o.name)} ${Math.min(o.lp,o.qp)}, og ${w.name} vinder spillet.`}else{text=`${allNames} nåede alle 36 i både LP og QP. Derfor blev deres laveste pointtal sammenlignet. ${w.name} havde det højeste laveste pointtal med ${Math.min(w.lp,w.qp)} og vinder spillet.`}}else if(mode==='qp'){if(pool.length===2){let o=pool.find(p=>p.id!==w.id);text=`${allNames} nåede begge 36 QP. Derfor blev deres LP sammenlignet. ${w.name} havde ${w.lp} LP mod ${poss(o.name)} ${o.lp} LP og vinder spillet.`}else{text=`${allNames} nåede alle 36 QP. Derfor blev deres LP sammenlignet. ${w.name} havde flest med ${w.lp} LP og vinder spillet.`}}else if(mode==='lp'){if(pool.length===2){let o=pool.find(p=>p.id!==w.id);text=`${allNames} nåede begge 36 LP. Derfor blev deres QP sammenlignet. ${w.name} havde ${w.qp} QP mod ${poss(o.name)} ${o.qp} QP og vinder spillet.`}else{text=`${allNames} nåede alle 36 LP. Derfor blev deres QP sammenlignet. ${w.name} havde flest med ${w.qp} QP og vinder spillet.`}}else{let o=pool.find(p=>p.id!==w.id), lpP=pool.find(p=>p.lp>=36&&p.qp<36),qpP=pool.find(p=>p.qp>=36&&p.lp<36);if(pool.length===2&&lpP&&qpP){text=`${lpP.name} nåede 36 LP, mens ${qpP.name} nåede 36 QP. Derfor blev ${poss(lpP.name)} QP sammenlignet med ${poss(qpP.name)} LP. ${w.name} havde ${w.id===lpP.id?w.qp:w.lp} ${w.id===lpP.id?'QP':'LP'} mod ${poss(o.name)} ${o.id===lpP.id?o.qp:o.lp} ${o.id===lpP.id?'QP':'LP'} og vinder spillet.`}else{text=`Spillerne nåede 36 i forskellige pointtyper. Derfor blev deres anden pointtype sammenlignet. ${w.name} havde det højeste pointtal i sammenligningen og vinder spillet.`}}return {type:'winner',winner:w,ids:[w.id],text}}
